version: "3.9"
services:

  jenkins:
    build: .
    container_name: jenkins
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jenkins.entrypoints=web"
      - "traefik.http.routers.jenkins.rule=Host(`jenkins.localhost`)"
      - "traefik.http.services.jenkins.loadbalancer.server.port=8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - jenkins-data:/var/jenkins_home
      - ./config:/var/jenkins_home/casc_configs
    environment:
      JENKINS_URL: http://${JENKINS_IP_ADDESS}:${JENKINS_PORT}
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false
      CASC_JENKINS_CONFIG: /var/jenkins_home/casc_configs/jenkins.yaml
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID}  
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD}
      JENKINS_ROMETE_ROOT_DIR: ${JENKINS_ROMETE_ROOT_DIR}
    restart: always
    networks:
        proxy:
          ipv4_address: ${JENKINS_IP_ADDESS}
   
networks: 
    proxy:
      external: true

volumes: 
    jenkins-data:
