http:
  middlewares:
    rateLimit:
      rateLimit:
        average: 200 # Requests per second
        burst: 300
    corsMiddleware:
      headers:
        accessControlAllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        accessControlAllowHeaders: "*"
        accessControlAllowOriginList: 
          # - http://localhost:2400
          - http://pva-web.localhost
        accessControlMaxAge: 100
        addVaryHeader: true
        accessControlAllowCredentials: true
    secureHeaders:
      headers:
        contentSecurityPolicy: frame-ancestors 'self' localhost:2400 *.localhost:2400 pva-web.localhost *.pva-web.localhost
        # forceSTSHeader: true
        # stsIncludeSubdomains: true
        # stsPreload: true
        # stsSeconds: 31536000
        # sslRedirect: true
        # framedeny: true
        # referrerPolicy: same-origin
        # customFrameOptionsValue: sameorigin
        # browserXssFilter: true
        # contentTypeNosniff: true

  