---
- name: run dashy docker-compose
  docker_compose:
    project_src: roles/docker/containers/dashy
    state: present
  register: docker_compose_dashy_output

- name: Restart Dashy if changed
  docker_compose:
    project_src: roles/docker/containers/dashy
    state: present
    restarted: yes
  when: docker_compose_dashy_output.changed