---
- name: install docker dependencies
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg-agent
      - software-properties-common
    update_cache: yes

- name: ensure apt keyrings directory exists
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: add docker gpg key
  apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present
    keyring: /etc/apt/keyrings/docker.gpg

- name: add docker repository
  apt_repository:
    filename: docker
    repo: deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu {{ ansible_lsb.codename|lower }} stable
    state: present

- name: install docker engine
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    update_cache: yes

- name: Install required Python packages
  apt:
    name:
      - python3-docker
      - python3-compose
    state: present

- name: ensure docker systemd override directory exists
  file:
    path: "{{ docker_systemd_override_dir }}"
    state: directory
    mode: '0755'

- name: configure docker listeners for local development
  copy:
    dest: "{{ docker_systemd_override_dir }}/override.conf"
    mode: '0644'
    content: |
      [Service]
      ExecStart=
      ExecStart=/usr/bin/dockerd -H tcp://{{ docker_tcp_host }}:{{ docker_tcp_port }} -H unix:///var/run/docker.sock

- name: Reload systemd daemon
  systemd:
    daemon_reload: yes

- name: Restart Docker service
  service:
    name: docker
    state: restarted
    enabled: yes

- name: Create Docker network
  docker_network:
    name: "{{ network }}"
    state: present
    driver: bridge
    ipam_config:
      - subnet: "{{ subnet }}"
