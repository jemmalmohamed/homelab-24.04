---
- name: Validate required homelab user inputs
  assert:
    that:
      - username is defined
      - username | length > 0
    fail_msg: "Pass the Linux username explicitly, for example: ansible-playbook docker-containers.playbook.yml -e 'username=myuser'"

- name: Traefik stack
  include_tasks: ./containers/traefik.yml
  tags:
    - traefik

- name: Homepage stack
  include_tasks: ./containers/homepage.yml
  tags:
    - homepage

- name: Portainer stack
  include_tasks: ./containers/portainer.yml
  tags:
    - portainer

- name: Prometheus and Grafana stack
  include_tasks: ./containers/prometheus-grafana.yml
  tags:
    - prometheus
    - grafana
    - monitoring

- name: Jenkins stack
  include_tasks: ./containers/jenkins.yml
  tags:
    - jenkins
