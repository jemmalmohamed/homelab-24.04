---
services:

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    command: --admin-password '$$2y$$05$$dm9n5ySRKaWuKWI1kwyQoOxhX9wVvYLuUM2fuNDYQs4Jn4DHCh2s6' # replace with a hash for your own admin password
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portainer.entrypoints=web"
      - "traefik.http.routers.portainer.rule=Host(`portainer.localhost`)"
      - "traefik.http.services.portainer.loadbalancer.server.port=9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    restart: always
    networks:
      - proxy

networks:
  proxy:
    external: true

volumes:
  portainer_data:
